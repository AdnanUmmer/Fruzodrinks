name: fruzo
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fruzo}
      POSTGRES_USER: ${POSTGRES_USER:-fruzo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    image: fruzo-backend:${RELEASE:-local}
    restart: unless-stopped
    environment:
      DJANGO_ENV: production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DOMAIN:?Set DOMAIN},backend
      DATABASE_URL: postgresql://${POSTGRES_USER:-fruzo}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fruzo}
      FRONTEND_ORIGIN: ${SITE_ORIGIN:?Set SITE_ORIGIN}
      CSRF_TRUSTED_ORIGINS: ${SITE_ORIGIN:?Set SITE_ORIGIN}
      CORS_ALLOWED_ORIGINS: ${SITE_ORIGIN:?Set SITE_ORIGIN}
      MEDIA_ROOT: /var/lib/fruzo/media
      TRUST_PROXY_SSL_HEADER: '1'
      TRUST_PROXY_CLIENT_IP: '1'
      ENQUIRY_PROXY_TOKEN: ${ENQUIRY_PROXY_TOKEN:?Set ENQUIRY_PROXY_TOKEN}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      ENQUIRY_NOTIFICATION_EMAIL: ${ENQUIRY_NOTIFICATION_EMAIL:-}
    volumes:
      - media:/var/lib/fruzo/media
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        SITE_ORIGIN: ${SITE_ORIGIN:?Set SITE_ORIGIN}
    image: fruzo-frontend:${RELEASE:-local}
    restart: unless-stopped
    environment:
      DEPLOYMENT_ENV: production
      API_ORIGIN: http://backend:8000
      SITE_ORIGIN: ${SITE_ORIGIN:?Set SITE_ORIGIN}
      ENQUIRY_PROXY_TOKEN: ${ENQUIRY_PROXY_TOKEN:?Set ENQUIRY_PROXY_TOKEN}
      TRUST_PROXY_CLIENT_IP: '1'
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
    depends_on: [backend]
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      WWW_DOMAIN: ${WWW_DOMAIN:?Set WWW_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, backend]
volumes:
  database:
  media:
  caddy_data:
  caddy_config:
